name: Repo Created

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # This job checks if the repository is new runs only once and deletes itself
  check-initial-commit:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if initial commit
        id: check
        run: |
          if [ $(git rev-list --count HEAD) -le 1 ]
          then
            echo "initial_commit=true" >> $GITHUB_OUTPUT
          else
            echo "initial_commit=false" >> $GITHUB_OUTPUT
          fi

      - name: Delete LICENSE file
        if: steps.check.outputs.initial_commit == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          rm -f LICENSE
          git add LICENSE
          git commit -m "Delete LICENSE file"
          git push

      - name: Change README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.check.outputs.initial_commit == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          echo "# ${{github.event.repository.name}} project :wave:" > README.md
          echo "---" >> README.md
          echo "## Usage" >> README.md
          echo "" >> README.md
          echo '1. Clone the project: ```git clone git@github.com:${{github.repository_owner}}/${{github.event.repository.name}}.git```' >> README.md
          echo "" >> README.md
          echo '2. Go to the project folder: ```cd ${{github.event.repository.name}}```' >> README.md
          echo "" >> README.md
          echo '3. Install [uv](https://github.com/astral-sh/uv): ```pip install uv```' >> README.md
          echo "" >> README.md
          echo '4. Sync dependencies: ```just sync```' >> README.md
          echo "" >> README.md
          echo '5. Build the Docker container: ```just build```' >> README.md
          echo "" >> README.md
          echo '6. Start the application: ```just up```' >> README.md
          echo "" >> README.md
          echo '7. Install pre-commit hooks: ```pre-commit install```' >> README.md
          echo "" >> README.md
          echo "> **Note:** This project has been tested and verified only on macOS. While it may work on other operating systems, we cannot guarantee full compatibility." >> README.md
          git add README.md
          git commit -m "Changed README.md"
          git push

      - name: Create AGENTS.md
        if: steps.check.outputs.initial_commit == 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_DESC: ${{ github.event.repository.description }}
        run: |
          if [ -f "TEMPLATE_AGENTS.md" ]; then
            rm -f AGENTS.md
            cp TEMPLATE_AGENTS.md AGENTS.md

            if [ -z "$REPO_DESC" ]; then
              REPO_DESC="A Python project built with modern tooling and best practices"
            fi

            sed -i "s|<reponame>|${REPO_NAME}|g" AGENTS.md
            sed -i "s|<description>|${REPO_DESC}|g" AGENTS.md

            rm -f TEMPLATE_AGENTS.md

            git config user.name github-actions[bot]
            git config user.email github-actions[bot]@users.noreply.github.com
            git add AGENTS.md TEMPLATE_AGENTS.md
            git commit -m "Create AGENTS.md from template"
            git push
          else
            echo "TEMPLATE_AGENTS.md not found, skipping..."
          fi

      - name: Remove current workflow
        if: steps.check.outputs.initial_commit == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/new-repo-created.yml
          git commit -m "Remove initial commit workflow"
          git push
